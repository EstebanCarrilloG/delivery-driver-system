version: '3.9'

services:
  mariadb:
    image: mariadb:11
    container_name: samp-mariadb

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: samp
      MYSQL_USER: sampuser
      MYSQL_PASSWORD: samppassword

    ports:
      - "3306:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
